name: Sync Upstream (Safe Merge, Keep Our Workflows)

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Configure Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://git.decemm.cn/hank/86JPGMTool.git

      - name: Fetch upstream changes
        run: git fetch upstream

      - name: Merge upstream changes (exclude .github/workflows)
        run: |
          git checkout main

          # 1. 备份当前的工作流目录（如果存在）
          if [ -d ".github/workflows" ]; then
            cp -r .github/workflows ../workflows_backup
            echo "Backup of .github/workflows created."
          else
            echo "No existing .github/workflows to backup."
          fi

          # 2. 执行合并，但不自动提交
          git merge upstream/main --allow-unrelated-histories -X ours --no-commit

          # 3. 从暂存区移除 .github/workflows 目录的所有变更
          #    这包括新增、修改或删除的文件
          if git ls-files --stage | grep -q "^.*\t\.github/workflows/"; then
            echo "Removing .github/workflows from staging area"
            git rm -r --cached .github/workflows/
          fi

          # 4. 恢复我们自己的工作流目录（从备份）
          if [ -d "../workflows_backup" ]; then
            # 删除可能被合并改动的工作区目录
            rm -rf .github/workflows
            # 复制备份回来
            cp -r ../workflows_backup .github/workflows
            # 将恢复的目录添加到暂存区
            git add .github/workflows/
            echo "Restored our own .github/workflows from backup."
          else
            # 如果没有备份，说明之前没有该目录，确保它不被创建
            rm -rf .github/workflows
            # 确保暂存区也没有该目录（已经删除了）
            echo "No previous workflows, deleted any incoming ones."
          fi

          # 5. 提交合并（此时不包含上游工作流文件）
          git commit -m "Merge upstream changes, keep our workflows" || echo "No changes to commit"

          # 6. 推送到远程
          git push origin main
