# DFO GM 工具配置文件
# 修改本文件后请重启 GM 工具。构建或发布时不会覆盖已有的 config.ini。
#
# 默认 false：工具只监听本机 localhost，不需要登录；数据库和 PVF 可在页面选择。
# 改为 true：工具监听全部网卡，允许局域网或 VPN 访问，并强制启用密码登录。
# 远程模式必须同时填写 remote_password、database_path 和 pvf_path；网页不能修改这些路径。
# 远程模式配置不完整或路径无效时，工具不会启动，并会显示具体错误原因。
# 配置使用 key=value 格式，键名不能重复；路径可使用一对单引号或双引号包裹。
# 工具自身使用 HTTP；不要暴露到公网。跨网段请配合防火墙白名单、VPN、SSH 隧道或 HTTPS 反向代理。
allow_remote_access=false

# 监听端口，默认 5050。远程模式监听 http://0.0.0.0:<端口>。
listen_port=5050

# 远程访问密码。仅 allow_remote_access=true 时必填，至少 8 个字符。
# 密码以明文保存在本机；请限制 config.ini 的文件访问权限，并使用高强度密码。
remote_password=

# 远程模式必须填写运行 GM 工具的服务器上的绝对路径。
# 路径中有空格可直接填写；如使用引号，必须用一对单引号或双引号完整包裹。
database_path=
pvf_path=
